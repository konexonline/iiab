- name: Derive service base name
  set_fact:
    service_base: "{{ bench_dir.split('/')[-1] }}"

- name: Enable production services
  systemd:
    name: "{{ service_base }}-{{ item }}.service"
    enabled: "{{ erpnext_enabled }}"
    state: started
  loop:
    - web
    - socketio
    - worker
  when: erpnext_installer_production_install == "yes"

- name: Handle development mode
  debug:
    msg: "Running in development mode - use bench commands for process management"
  when: erpnext_installer_production_install != "yes"