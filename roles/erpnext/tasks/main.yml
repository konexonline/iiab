- name: Configure passwordless sudo for frappe_user
  lineinfile:
    path: /etc/sudoers
    line: "{{ frappe_user }} ALL=(ALL) NOPASSWD:ALL"
    validate: visudo -cf %s
  become: yes

- name: Update and upgrade system packages
  become: yes
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Ensure ERPNext user exists
  become: yes
  user:
    name: "{{ frappe_user }}"
    create_home: yes
    shell: /bin/bash
    group: www-data

- name: Install core dependencies
  include_role:
    name: "{{ item }}"
  loop:
    - mysql
    - nodejs
    - yarn
  vars:
    mysql_install: true
    mysql_enabled: true
    nodejs_install: true
    nodejs_enabled: true
    yarn_install: true
    yarn_enabled: true

- name: Install system dependencies
  become: yes
  apt:
    name: "{{ system_dependencies }}"
    state: present

- name: Validate prerequisites
  block:
    - name: Verify IIAB MySQL installation
      assert:
        that: mysql_installed | default(false) | bool
        msg: "Requires IIAB MySQL role installed first"
    - name: Validate boolean parameters
      assert:
        that:
          - erpnext_install | type_debug == 'bool'
          - erpnext_enabled | type_debug == 'bool'
        success_msg: "Valid parameters detected"
        fail_msg: "Invalid boolean values in parameters"

- name: Configure MariaDB
  become: yes
  template:
    src: mariadb.cnf.j2
    dest: /etc/mysql/conf.d/mariadb_erpnext.cnf
  notify: Restart MariaDB

- name: Set bench directory ownership
  file:
    path: "{{ bench_dir }}"
    owner: "{{ frappe_user }}"
    group: "{{ frappe_user }}"
    recurse: yes
  become: yes

- name: Run ERPNext installer
  include_tasks: installer.yml
  when: erpnext_use_installer_script

- name: Configure services
  include_tasks: enable-or-disable.yml

- name: Validate installation
  include_tasks: validate.yml

- name: Update IIAB registry and Persist credentials
  ini_file:
    path: "{{ iiab_ini_file }}"
    section: erpnext
    option: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: 'ernext_install', value: 'true' }
    - { key: 'erpnext_enabled', value: 'true' }
    - { key: 'erpnext_version', value: '{{ erpnext_version }}' }
    - { key: 'db_password', value: '{{ erpnext_db_password }}' }
    - { key: 'admin_password', value: '{{ erpnext_admin_password }}' }
  no_log: true
